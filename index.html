<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="img/favicon.ico" sizes="any" />
  </head>

  <body>
    <main class="flex justify-center py-[120px]">
      <article
        class="w-[340px] flex flex-col items-center bg-white rounded-lg"
        aria-label="A Blog Card with image, content, and link to read more"
      >
        <img
          class="self-stretch h-72 object-cover rounded-t-lg"
          src="/img/spacejoy-YqFz7UMm8qE-unsplash.jpg"
          alt="Potrait of a Room"
          loading="lazy"
        />
        <div class="flex flex-col gap-3 self-stretch px-4 py-6">
          <div class="flex flex-col gap-2">
            <div
              class="flex items-center bg-green-50 px-2 py-0.5 rounded-full border border-solid border-green-200 w-fit"
            >
              <p class="font-normal text-sm text-center text-green-700">
                Interior
              </p>
            </div>
            <span class="font-semibold text-lg text-neutral-900">
              Top 5 Living Room Inspirations
            </span>
          </div>
          <div class="flex flex-col gap-6 self-stretch">
            <span class="font-medium text-base text-neutral-600"
              >Curated vibrants colors for your living, make it pop & calm in
              the same time.
            </span>
            <button
              class="flex items-center gap-1.5 w-fit rounded text-indigo-700 hover:text-indigo-800 disabled:text-neutral-400 focus:ring focus:ring-indigo-100 focus:ring-offset-2 disabled:cursor-not-allowed disabled:text-neutral-400"
              onclick=""
            >
              <span class="font-medium text-base">Read more</span>
              <div class="w-5 h-5">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  class="disabled:text-neutral-400"
                >
                  <path
                    d="M13.4764 9.16658L9.00637 4.69657L10.1849 3.51807L16.6667 9.99992L10.1849 16.4817L9.00637 15.3032L13.4764 10.8332H3.33337V9.16658H13.4764Z"
                    fill="currentColor"
                  />
                </svg>
              </div>
            </button>
          </div>
        </div>
      </article>
    </main>

    <div class="credits" data-gfe-screenshot-exclude="true">
      A challenge by
      <a
        href="https://www.greatfrontend.com/projects?ref=challenges"
        target="_blank"
        >GreatFrontEnd Projects</a
      >. Built by
      <a
        href="https://www.greatfrontend.com/projects/u/harshitashva"
        target="_blank"
        >Harshit Soni</a
      >.
    </div>
  </body>
</html>
